# ── config.yaml — Replicación JRFM-4427748 ─────────────────────────────────
# Configuración central del pipeline. Modificar aquí; el código lee de aquí.

paths:
  raw_data:       data/raw
  processed_data: data/processed
  outputs:        outputs
  tables:         outputs/tables
  figures:        outputs/figures
  models:         outputs/models
  logs:           logs
  stamps:         .stamps

series:
  - name:   BTC-USD
    ticker:  BTC-USD
    start:  "2013-04-28"
    end:    "2026-07-01"
  - name:   ETH-USD
    ticker:  ETH-USD
    start:  "2015-08-07"
    end:    "2026-07-01"
  - name:   DJIA
    ticker:  "^DJI"
    start:  "2015-06-01"
    end:    "2026-07-01"
  - name:   SP500
    ticker:  "^GSPC"
    start:  "2015-06-01"
    end:    "2026-07-01"
  - name:   GOLD
    ticker:  "GC=F"
    start:  "2015-06-01"
    end:    "2026-07-01"
  - name:   OIL
    ticker:  "CL=F"
    start:  "2015-06-01"
    end:    "2026-07-01"

split:
  train_frac: 0.80
  val_frac:   0.10
  # test_frac = 1 - train_frac - val_frac = 0.10 (implícito)

seed: 42        # semilla base; derivar S semillas como seed + i
n_seeds: 10     # S = 10 semillas para modelos neuronales

returns_scale: 100   # escalar 100×log-ret → puntos porcentuales

# ── Datos: ventana de entrada única y escalado (Secciones 4-5 respecificación) ──
# data.window es la ÚNICA fuente de la longitud de ventana: aplica a las
# cuatro series y a todos los modelos neuronales. No debe existir ningún
# override por mercado ni por modelo (ver _get_window_size en tune_and_train.py,
# que aborta la ejecución si detecta uno).
data:
  window: 5   # ~semana bursátil (2026-08-01, prueba pendiente de correr -- ver model: abajo)
  input_scaling: unconditional   # unconditional: eps2_t/sigma2_train | log1p: log1p(eps2_t)

# ── Espacio de búsqueda de hiperparámetros (compartido por todos los modelos DL) ──
hyperparameter_search:
  lstm_units:    [16, 32, 64, 128]
  nu:            [3, 4, 5, 6, 7, 8]          # grados de libertad Student-t
  dropout:       [0.0, 0.1, 0.2, 0.3]
  lambda_values: [0.1, 0.3, 0.5, 0.7, 0.9]   # peso pérdida híbrida
  batch_size:    [32, 64, 128]
  max_epochs:    1000
  patience:      20    # early-stopping
  n_trials:      50    # ensayos Keras Tuner
  cv_splits:     5     # TimeSeriesSplit k-folds
  full_batch_max_epochs: 5000   # solo si model.full_batch_training=true (solo lstm_t_student)
  full_batch_patience:   300    # early-stopping cuenta gradientes, no minibatches -> paciencia mayor

# ── Análisis de sensibilidad de λ (exigido por Jurado 1) ──
lambda_sensitivity: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9, 1.0]

# ── Model Confidence Set ──
mcs:
  level:       0.90
  n_bootstrap: 10000
  block_size:  20

# ── Diebold-Mariano ──
dm_test:
  bandwidth: null   # null → automático: floor(4*(T/100)^(2/9))

# ── TOST de equivalencia sobre QLIKE (Sección 9.4 respecificación) ──
tost:
  delta_pct: 0.02   # margen de equivalencia = delta_pct × pérdida QLIKE media de GARCH(1,1)

# ── VaR/ES backtests ──
var_confidence_levels: [0.99, 0.975]

# ── Verificación varianza incondicional ──
unconditional_var_tolerance: 0.20

# ── Normalización de la pérdida híbrida (Sección 2 respecificación) ──
loss:
  normalize: true   # false reproduce exactamente el comportamiento anterior (sin normalizar)

# ── ν del modelo propuesto (Sección 8 respecificación) ──
# El modelo propuesto (LSTM-SSE-t-Student) ya NO usa inicialización ni
# parámetros del modelo GARCH en ningún punto (ni pesos, ni estado inicial,
# ni el valor de arranque de ν) -- ver docstring de build_lstm_t_student
# en src/models/neural.py. La verificación de Sección 6 (src/models/
# garch_init.py) sigue existiendo como chequeo estructural independiente
# (¿puede la arquitectura LSTM reproducir la solución GARCH si se le
# inyecta?), pero ya no alimenta el entrenamiento del modelo propuesto.
model:
  nu_mode: learned   # learned: ν = 2+softplus(ρ) entrenable, ρ inicializado en un valor neutral fijo (ν=5)
                     # likelihood_search: ν seleccionado por verosimilitud Student-t OOS en validación
                     #   (nunca por MSE de validación) sobre hyperparameter_search.nu
                     # En ambos casos ν queda fuera del espacio de búsqueda del tuner.
  full_batch_training: true   # batch_size=n_train (solo lstm_t_student, ver hyperparameter_search.full_batch_*)
                               # validado en BTC-USD/ETH-USD: no degenera, backtests VaR/ES limpios (2026-07-30)
  adaptive_lr: true   # warm-up + cosine decay (monótono, sin restarts) en la LR de Adam (solo
                       # lstm_t_student, ver neural._make_adaptive_lr_schedule). Revisado 2026-08-01:
                       # la versión con restarts (SGDR) no mostró beneficio consistente contra el
                       # colapso y, al subir la LR periódicamente, reseteaba el contador de paciencia
                       # de EarlyStopping -- dejando trials correr cerca del tope de épocas sin
                       # necesidad (causa probable de que la búsqueda de GOLD tardara mucho más que
                       # el resto). El decay liso deja que val_loss se estabilice de forma predecible.
  # ── Levers experimentales contra el colapso (2026-08-01, PENDIENTE DE CORRER) ──
  # Probados por separado hoy en corridas baratas (3 semillas, best_hparams.json
  # reusado): use_qlike ayudó a ETH-USD/DJIA/SP500 pero rompió OIL (mse_ratio
  # 11.6x -- σ̂² sobre-reacciona sin calibrar magnitud); grad_noise y lam_anneal
  # solos dieron resultados planos en DJIA. Combinados aquí + window=5 sin
  # validar juntos todavía -- decidir/ajustar (p.ej. excluir OIL de use_qlike)
  # antes de lanzar la búsqueda completa de producción.
  grad_noise: true        # ruido de gradiente aditivo decreciente (Neelakantan et al. 2015)
  lam_anneal: true         # rampa lineal de λ en vez de mantenerlo fijo (analogía KL-annealing/VAE)
  lam_start: 0.1
  lam_end: 0.9
  lam_anneal_steps: 200
  use_qlike: true          # reemplaza el término SSE por QLIKE (Patton 2011)

# ── Reentrenar solo el modelo propuesto en las 6 series (batch completo) ──
# Los otros 6 modelos econométricos ya tienen resultados válidos y no se
# re-corren (MSGARCH nunca corrió -- R no está instalado en este entorno).
train_only_models: [lstm_t_student]
